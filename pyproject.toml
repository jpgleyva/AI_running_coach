[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-running-coach"
version = "0.1.0"
description = "Agente conversacional de running y recomposición corporal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "github-copilot-sdk>=0.1.0,<1.0",
]

[project.scripts]
running-coach = "running_coach.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
